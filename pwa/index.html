<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a3558" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SWO Certs" />
  <link rel="manifest" href="manifest.json" />
  <title>SWO &amp; Co – Certificate Tracker</title>

  <!-- OneSignal Push SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:        #1a3558;
      --navy-dark:   #112240;
      --navy-light:  #234876;
      --bg:          #eef2f7;
      --card:        #ffffff;
      --text:        #1a2a3a;
      --text-muted:  #6b7a8d;
      --border:      #dde3ec;
      --accent:      #2980b9;
      --accent-dark: #1f6390;

      --critical:    #c0392b;
      --critical-bg: #fdf3f2;
      --critical-lt: #fce8e6;

      --high:        #e67e22;
      --high-bg:     #fef5eb;
      --high-lt:     #fdebd0;

      --medium:      #c9a000;
      --medium-bg:   #fefbef;
      --medium-lt:   #fef3c7;

      --low:         #27ae60;
      --low-bg:      #f0fdf4;
      --low-lt:      #dcfce7;

      --radius:      12px;
      --shadow:      0 2px 12px rgba(0,0,0,0.08);
      --shadow-lg:   0 8px 32px rgba(0,0,0,0.18);
      --transition:  0.2s ease;

      --header-h:    64px;
      --nav-h:       64px;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Layout ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--navy);
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      padding-top: env(safe-area-inset-top);
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      position: relative;
      z-index: 10;
    }

    .header-brand {
      display: flex;
      flex-direction: column;
    }

    .header-brand .name {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.3px;
    }

    .header-brand .sub {
      font-size: 11px;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      background: rgba(255,255,255,0.12);
      border: none;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      font-size: 18px;
      transition: background var(--transition);
    }

    .btn-icon:active { background: rgba(255,255,255,0.22); }

    .badge {
      background: #e74c3c;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 999px;
      padding: 1px 5px;
      min-width: 18px;
      text-align: center;
      display: none;
    }

    .badge.visible { display: inline-block; }

    /* ── Main scrollable area ── */
    main {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 16px 8px;
    }

    /* ── Tabs ── */
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* ── Bottom Nav ── */
    nav.bottom-nav {
      background: var(--navy);
      height: var(--nav-h);
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
      flex-shrink: 0;
      border-top: 1px solid var(--navy-light);
    }

    .nav-btn {
      flex: 1;
      background: none;
      border: none;
      color: rgba(255,255,255,0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      transition: color var(--transition);
      position: relative;
    }

    .nav-btn .nav-icon { font-size: 20px; line-height: 1; }

    .nav-btn.active {
      color: #ffffff;
    }

    .nav-btn.active::after {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 2px;
      background: #3b9fd4;
      border-radius: 0 0 3px 3px;
    }

    .nav-btn .nav-badge {
      position: absolute;
      top: 6px;
      right: calc(50% - 18px);
      background: #e74c3c;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      border-radius: 999px;
      padding: 1px 4px;
      min-width: 16px;
      text-align: center;
      display: none;
    }

    .nav-btn .nav-badge.visible { display: block; }

    /* ── Section Header ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .section-count {
      font-size: 12px;
      color: var(--text-muted);
      background: var(--border);
      padding: 2px 8px;
      border-radius: 999px;
    }

    /* ── Alert Card ── */
    .alert-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 12px;
      overflow: hidden;
      border-left: 5px solid transparent;
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .alert-card:active { transform: scale(0.98); }

    .alert-card.critical { border-left-color: var(--critical); }
    .alert-card.high     { border-left-color: var(--high); }
    .alert-card.medium   { border-left-color: var(--medium); }
    .alert-card.low      { border-left-color: var(--low); }

    .card-top {
      padding: 12px 14px 8px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .urgency-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 3px 8px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .urgency-badge.critical { background: var(--critical-lt); color: var(--critical); }
    .urgency-badge.high     { background: var(--high-lt);     color: var(--high); }
    .urgency-badge.medium   { background: var(--medium-lt);   color: var(--medium); }
    .urgency-badge.low      { background: var(--low-lt);      color: var(--low); }

    .cert-type {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-body {
      padding: 0 14px 10px;
    }

    .property-address {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .expiry-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .expiry-date {
      font-size: 13px;
      color: var(--text-muted);
    }

    .days-pill {
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .days-pill.critical { background: var(--critical-lt); color: var(--critical); }
    .days-pill.high     { background: var(--high-lt);     color: var(--high); }
    .days-pill.medium   { background: var(--medium-lt);   color: var(--medium); }
    .days-pill.low      { background: var(--low-lt);      color: var(--low); }

    .card-actions {
      border-top: 1px solid var(--border);
      display: flex;
    }

    .card-btn {
      flex: 1;
      border: none;
      background: none;
      padding: 11px 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .card-btn:active { background: var(--bg); }

    .card-btn + .card-btn {
      border-left: 1px solid var(--border);
    }

    .btn-todo { color: var(--navy); }
    .btn-todo.added { color: var(--low); }
    .btn-fixed { color: var(--accent); }

    /* ── Empty State ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      text-align: center;
      gap: 12px;
    }

    .empty-icon { font-size: 52px; }

    .empty-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }

    .empty-sub {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* ── Loading ── */
    .loading-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px;
      gap: 14px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* ── Error Banner ── */
    .error-banner {
      background: var(--critical-lt);
      border: 1px solid var(--critical);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--critical);
      display: none;
    }

    .error-banner.visible { display: block; }

    /* ── Last updated ── */
    .last-updated {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      padding: 4px 0 12px;
    }

    /* ── Modal Overlay ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: flex-end;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal-sheet {
      background: var(--card);
      border-radius: 20px 20px 0 0;
      width: 100%;
      padding: 0 0 env(safe-area-inset-bottom);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      overflow: hidden;
    }

    .modal-overlay.open .modal-sheet {
      transform: translateY(0);
    }

    .modal-handle {
      width: 36px;
      height: 4px;
      background: var(--border);
      border-radius: 999px;
      margin: 12px auto 0;
    }

    .modal-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 2px;
    }

    .modal-subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .modal-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
    }

    .field-date {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color var(--transition);
    }

    .field-date:focus { border-color: var(--accent); }

    .modal-info-card {
      background: var(--bg);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .modal-info-card .info-address {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 2px;
    }

    .modal-info-card .info-cert {
      font-size: 12px;
      color: var(--text-muted);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      padding: 4px 20px 20px;
    }

    .btn-primary {
      flex: 1;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background var(--transition);
    }

    .btn-primary:active { background: var(--navy-dark); }
    .btn-primary:disabled { background: var(--border); color: var(--text-muted); cursor: default; }

    .btn-secondary {
      flex: 0 0 auto;
      background: var(--bg);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition);
    }

    .btn-secondary:active { background: var(--border); }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--navy-dark);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: 999px;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 200;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Push prompt banner ── */
    .push-banner {
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
    }

    .push-banner-text {
      flex: 1;
    }

    .push-banner-text strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
    }

    .push-banner-text span {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
    }

    .btn-enable-push {
      background: #fff;
      color: var(--navy);
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-dismiss-push {
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 4px;
    }

    /* ── Success animation ── */
    @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
    .pop { animation: pop 0.25s ease; }
  </style>
</head>
<body>

<div id="app">

  <!-- ── Header ── -->
  <header>
    <div class="header-brand">
      <span class="name">SWO &amp; Co</span>
      <span class="sub">Certificate Tracker</span>
    </div>
    <div class="header-right">
      <button class="btn-icon" id="btn-refresh" title="Refresh">&#8635;</button>
    </div>
  </header>

  <!-- ── Main Content ── -->
  <main id="main">

    <!-- Alerts Tab -->
    <div class="tab-pane active" id="tab-alerts">
      <div id="push-banner-wrap"></div>
      <div id="alerts-error" class="error-banner"></div>
      <div id="alerts-content">
        <div class="loading-wrap">
          <div class="spinner"></div>
          <div class="loading-text">Loading certificates…</div>
        </div>
      </div>
    </div>

    <!-- To-Do Tab -->
    <div class="tab-pane" id="tab-todo">
      <div id="todo-content"></div>
    </div>

  </main>

  <!-- ── Bottom Navigation ── -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="alerts" id="nav-alerts">
      <span class="nav-icon">🔔</span>
      Alerts
      <span class="nav-badge" id="alert-nav-badge"></span>
    </button>
    <button class="nav-btn" data-tab="todo" id="nav-todo">
      <span class="nav-icon">✅</span>
      To-Do
      <span class="nav-badge" id="todo-nav-badge"></span>
    </button>
  </nav>

</div>

<!-- ── Fixed Date Modal ── -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-sheet" id="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">Mark as Fixed</div>
      <div class="modal-subtitle" id="modal-subtitle">Enter the new certificate expiry date</div>
    </div>
    <div class="modal-body">
      <div class="modal-info-card">
        <div class="info-address" id="modal-address"></div>
        <div class="info-cert" id="modal-cert"></div>
      </div>
      <div>
        <div class="field-label">New Expiry Date</div>
        <input type="date" class="field-date" id="modal-date" />
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="modal-cancel">Cancel</button>
      <button class="btn-primary" id="modal-save">Save to Sheet</button>
    </div>
  </div>
</div>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<script>
  // ════════════════════════════════════════════
  //  CONFIG — paste your Apps Script URL here
  // ════════════════════════════════════════════
  const SCRIPT_URL      = 'YOUR_APPS_SCRIPT_WEB_APP_URL';   // replace after deploying
  const ONESIGNAL_APP_ID = 'YOUR_ONESIGNAL_APP_ID';          // replace after OneSignal setup

  // ════════════════════════════════════════════
  //  STATE
  // ════════════════════════════════════════════
  let alerts      = [];
  let todoList    = loadTodo();
  let activeTab   = 'alerts';
  let modalAlert  = null;
  let isFromTodo  = false;
  let isLoading   = false;

  // Urgency display config
  const URGENCY = {
    critical: { label: 'Critical',  icon: '⛔', days: 'Expires today!' },
    high:     { label: 'High',      icon: '⚠️', days: d => `${d} day${d===1?'':'s'} left` },
    medium:   { label: 'Medium',    icon: '🟡', days: d => `${d} days left` },
    low:      { label: 'Low',       icon: '🟢', days: d => `${d} days left` },
  };

  // ════════════════════════════════════════════
  //  ONESIGNAL PUSH SETUP
  // ════════════════════════════════════════════
  window.OneSignalDeferred = window.OneSignalDeferred || [];

  function initPush() {
    if (!ONESIGNAL_APP_ID || ONESIGNAL_APP_ID === 'YOUR_ONESIGNAL_APP_ID') return;
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: ONESIGNAL_APP_ID,
        notifyButton: { enable: false },
        allowLocalhostAsSecureOrigin: true,
      });
    });
  }

  function showPushBanner() {
    if (!ONESIGNAL_APP_ID || ONESIGNAL_APP_ID === 'YOUR_ONESIGNAL_APP_ID') return;
    if (localStorage.getItem('push_dismissed')) return;

    const wrap = document.getElementById('push-banner-wrap');
    wrap.innerHTML = `
      <div class="push-banner" id="push-banner">
        <div class="push-banner-text">
          <strong>Enable Notifications</strong>
          <span>Get alerts when certificates are expiring</span>
        </div>
        <button class="btn-enable-push" id="btn-enable-push">Enable</button>
        <button class="btn-dismiss-push" id="btn-dismiss-push">✕</button>
      </div>`;

    document.getElementById('btn-enable-push').onclick = () => {
      OneSignalDeferred.push(async (OS) => {
        await OS.Notifications.requestPermission();
        wrap.innerHTML = '';
        showToast('Notifications enabled ✓');
      });
    };

    document.getElementById('btn-dismiss-push').onclick = () => {
      localStorage.setItem('push_dismissed', '1');
      wrap.innerHTML = '';
    };
  }

  // ════════════════════════════════════════════
  //  DATA FETCH
  // ════════════════════════════════════════════
  async function fetchAlerts() {
    if (isLoading) return;
    isLoading = true;

    setAlertsContent(`
      <div class="loading-wrap">
        <div class="spinner"></div>
        <div class="loading-text">Loading certificates…</div>
      </div>`);

    hideError();

    try {
      if (!SCRIPT_URL || SCRIPT_URL === 'YOUR_APPS_SCRIPT_WEB_APP_URL') {
        // Demo data when URL not yet configured
        alerts = getDemoAlerts();
      } else {
        const res  = await fetch(SCRIPT_URL + '?action=getAlerts');
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Failed to load');
        alerts = data.alerts || [];
      }

      renderAlerts();
      updateNavBadges();
      showPushBanner();

    } catch (err) {
      showError('Could not load alerts: ' + err.message);
      setAlertsContent('');
    } finally {
      isLoading = false;
    }
  }

  // ════════════════════════════════════════════
  //  RENDER: ALERTS
  // ════════════════════════════════════════════
  function renderAlerts() {
    if (!alerts.length) {
      setAlertsContent(`
        <div class="empty-state">
          <div class="empty-icon">✅</div>
          <div class="empty-title">All Clear!</div>
          <div class="empty-sub">No certificates expiring within 30 days.</div>
        </div>`);
      return;
    }

    const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    let html = `<div class="section-header">
      <span class="section-title">Expiring Certificates</span>
      <span class="section-count">${alerts.length}</span>
    </div>`;

    alerts.forEach(alert => {
      html += buildCard(alert, false);
    });

    html += `<div class="last-updated">Updated at ${now}</div>`;
    setAlertsContent(html);
    attachCardListeners();
  }

  // ════════════════════════════════════════════
  //  RENDER: TO-DO
  // ════════════════════════════════════════════
  function renderTodo() {
    const wrap = document.getElementById('todo-content');
    if (!todoList.length) {
      wrap.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📋</div>
          <div class="empty-title">To-Do List is Empty</div>
          <div class="empty-sub">Tap "Add to To-Do" on any alert to track it here.</div>
        </div>`;
      return;
    }

    let html = `<div class="section-header">
      <span class="section-title">Action Needed</span>
      <span class="section-count">${todoList.length}</span>
    </div>`;

    todoList.forEach(item => {
      html += buildCard(item, true);
    });

    wrap.innerHTML = html;
    attachCardListeners();
  }

  // ════════════════════════════════════════════
  //  BUILD CARD HTML
  // ════════════════════════════════════════════
  function buildCard(alert, isTodo) {
    const u        = URGENCY[alert.urgency] || URGENCY.low;
    const daysText = alert.daysLeft <= 0
      ? '⛔ EXPIRED'
      : alert.daysLeft === 1
        ? '1 day left'
        : `${alert.daysLeft} days left`;

    const inTodo    = isInTodo(alert.id);
    const todoLabel = isTodo
      ? `<span>✕</span> Remove`
      : inTodo
        ? `<span>✓</span> Added`
        : `<span>＋</span> To-Do`;
    const todoCls   = isTodo ? 'btn-todo removing' : inTodo ? 'btn-todo added' : 'btn-todo';

    return `
    <div class="alert-card ${alert.urgency}" data-id="${alert.id}">
      <div class="card-top">
        <span class="cert-type">${alert.certType} Certificate</span>
        <span class="urgency-badge ${alert.urgency}">${u.icon} ${u.label}</span>
      </div>
      <div class="card-body">
        <div class="property-address">${escHtml(alert.address)}</div>
        <div class="expiry-row">
          <span class="expiry-date">Expires ${alert.expiry}</span>
          <span class="days-pill ${alert.urgency}">${daysText}</span>
        </div>
      </div>
      <div class="card-actions">
        <button class="card-btn ${todoCls}" data-id="${alert.id}" data-action="${isTodo ? 'remove' : 'todo'}">${todoLabel}</button>
        <button class="card-btn btn-fixed" data-id="${alert.id}" data-action="fixed" data-todo="${isTodo}">🛠 Fixed</button>
      </div>
    </div>`;
  }

  // ════════════════════════════════════════════
  //  CARD EVENT DELEGATION
  // ════════════════════════════════════════════
  function attachCardListeners() {
    document.querySelectorAll('[data-action]').forEach(btn => {
      btn.onclick = (e) => {
        const action  = btn.dataset.action;
        const id      = btn.dataset.id;
        const isTodo  = btn.dataset.todo === 'true';
        const alert   = findAlert(id);
        if (!alert) return;

        if (action === 'todo')   handleAddTodo(alert, btn);
        if (action === 'remove') handleRemoveTodo(alert);
        if (action === 'fixed')  openModal(alert, isTodo);
      };
    });
  }

  // ════════════════════════════════════════════
  //  TO-DO ACTIONS
  // ════════════════════════════════════════════
  function handleAddTodo(alert, btn) {
    if (isInTodo(alert.id)) return;
    todoList.push({ ...alert });
    saveTodo();
    updateNavBadges();
    renderTodo();

    // Update button in place
    btn.className = 'card-btn btn-todo added';
    btn.innerHTML = '<span>✓</span> Added';
    btn.classList.add('pop');
    showToast(`"${alert.certType}" added to To-Do`);
  }

  function handleRemoveTodo(alert) {
    todoList = todoList.filter(t => t.id !== alert.id);
    saveTodo();
    updateNavBadges();
    renderTodo();
    showToast('Removed from To-Do');
  }

  // ════════════════════════════════════════════
  //  MODAL
  // ════════════════════════════════════════════
  function openModal(alert, fromTodo) {
    modalAlert = alert;
    isFromTodo = fromTodo;

    document.getElementById('modal-address').textContent = alert.address;
    document.getElementById('modal-cert').textContent    = alert.certType + ' Certificate · Current expiry: ' + alert.expiry;
    document.getElementById('modal-subtitle').textContent = 'Enter the new expiry date for this certificate';

    // Set minimum date to today
    const today = new Date().toISOString().split('T')[0];
    const input = document.getElementById('modal-date');
    input.min   = today;
    input.value = '';

    document.getElementById('modal-overlay').classList.add('open');
    setTimeout(() => input.focus(), 350);
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    modalAlert = null;
  }

  async function saveFixed() {
    const newDate = document.getElementById('modal-date').value;
    if (!newDate) { showToast('Please select a date'); return; }

    const saveBtn = document.getElementById('modal-save');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    try {
      if (SCRIPT_URL && SCRIPT_URL !== 'YOUR_APPS_SCRIPT_WEB_APP_URL') {
        const res  = await fetch(SCRIPT_URL, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({
            action:    'updateCert',
            row:       modalAlert.row,
            certField: modalAlert.certField,
            newDate:   newDate,
          }),
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Save failed');
      }

      // Remove from to-do if it was there
      if (isInTodo(modalAlert.id)) {
        todoList = todoList.filter(t => t.id !== modalAlert.id);
        saveTodo();
      }

      closeModal();
      showToast('✓ Saved! Sheet updated.');
      updateNavBadges();

      // Refresh alerts after short delay
      setTimeout(fetchAlerts, 800);
      if (isFromTodo) renderTodo();

    } catch (err) {
      showToast('Error: ' + err.message);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save to Sheet';
    }
  }

  // ════════════════════════════════════════════
  //  TAB NAVIGATION
  // ════════════════════════════════════════════
  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('nav-' + tab).classList.add('active');
    document.getElementById('main').scrollTop = 0;

    if (tab === 'todo') renderTodo();
  }

  // ════════════════════════════════════════════
  //  UTILITIES
  // ════════════════════════════════════════════
  function findAlert(id) {
    return alerts.find(a => a.id === id) || todoList.find(a => a.id === id);
  }

  function isInTodo(id) { return todoList.some(t => t.id === id); }

  function loadTodo()  { try { return JSON.parse(localStorage.getItem('swo_todo') || '[]'); } catch { return []; } }
  function saveTodo()  { localStorage.setItem('swo_todo', JSON.stringify(todoList)); }

  function updateNavBadges() {
    const ab = document.getElementById('alert-nav-badge');
    const tb = document.getElementById('todo-nav-badge');
    const ac = alerts.length;
    const tc = todoList.length;

    ab.textContent = ac;
    ab.classList.toggle('visible', ac > 0);
    tb.textContent = tc;
    tb.classList.toggle('visible', tc > 0);
  }

  function setAlertsContent(html) {
    document.getElementById('alerts-content').innerHTML = html;
  }

  function showError(msg) {
    const el = document.getElementById('alerts-error');
    el.textContent = msg;
    el.classList.add('visible');
  }

  function hideError() {
    document.getElementById('alerts-error').classList.remove('visible');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ════════════════════════════════════════════
  //  DEMO DATA (shown before SCRIPT_URL is set)
  // ════════════════════════════════════════════
  function getDemoAlerts() {
    return [
      { id:'13-electrical', row:13, address:'14 Maple Street, London E1 4BT',  certType:'Electrical', certField:'electrical', expiry:'10/07/2026', expiryRaw:'2026-07-10', daysLeft:1,  urgency:'critical' },
      { id:'15-gas',        row:15, address:'7 Oak Avenue, London SE5 9PQ',    certType:'Gas',        certField:'gas',        expiry:'14/07/2026', expiryRaw:'2026-07-14', daysLeft:5,  urgency:'high'     },
      { id:'18-epc',        row:18, address:'23 Birch Road, London N7 6HH',    certType:'EPC',        certField:'epc',        expiry:'20/07/2026', expiryRaw:'2026-07-20', daysLeft:11, urgency:'medium'   },
      { id:'20-electrical', row:20, address:'88 Cedar Close, London SW9 1AA',  certType:'Electrical', certField:'electrical', expiry:'02/08/2026', expiryRaw:'2026-08-02', daysLeft:24, urgency:'low'      },
    ];
  }

  // ════════════════════════════════════════════
  //  INIT
  // ════════════════════════════════════════════
  function init() {
    // Nav buttons
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    // Refresh button
    document.getElementById('btn-refresh').addEventListener('click', fetchAlerts);

    // Modal close on overlay click
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modal-overlay')) closeModal();
    });

    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('modal-save').addEventListener('click', saveFixed);

    // Init push
    initPush();

    // Load data
    fetchAlerts();
    updateNavBadges();
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
